<div class="icon-properties">
  <div class="icon-properties__group" aria-label="Icon sizes">
    <span class="icon-properties__sample">
      <aesir-icon name="settings" size="16"></aesir-icon>
      <small>16px</small>
    </span>
    <span class="icon-properties__sample">
      <aesir-icon name="settings" size="20"></aesir-icon>
      <small>20px</small>
    </span>
    <span class="icon-properties__sample">
      <aesir-icon name="settings" size="24"></aesir-icon>
      <small>24px</small>
    </span>
    <span class="icon-properties__sample">
      <aesir-icon name="settings" size="32"></aesir-icon>
      <small>32px</small>
    </span>
  </div>

  <div class="icon-properties__group" aria-label="Status colors">
    <span class="icon-properties__sample">
      <span class="icon-properties__status" style="--icon-color: var(--ds-emphasis-blue); --icon-surface: var(--ds-surface-blue)"><aesir-icon name="info" size="20"></aesir-icon></span>
      <small>Info</small>
    </span>
    <span class="icon-properties__sample">
      <span class="icon-properties__status" style="--icon-color: var(--ds-emphasis-green); --icon-surface: var(--ds-surface-green)"><aesir-icon name="check" size="20"></aesir-icon></span>
      <small>Success</small>
    </span>
    <span class="icon-properties__sample">
      <span class="icon-properties__status" style="--icon-color: var(--ds-emphasis-orange); --icon-surface: var(--ds-surface-orange)"><aesir-icon name="alert-circle" size="20"></aesir-icon></span>
      <small>Warning</small>
    </span>
  </div>

  <div class="icon-properties__group" aria-label="Icon buttons">
    <aesir-button size="icon" variant="outline" aria-label="Settings"><aesir-icon name="settings"></aesir-icon></aesir-button>
    <aesir-button size="icon" variant="accent" aria-label="Confirm"><aesir-icon name="check"></aesir-icon></aesir-button>
  </div>
</div>
