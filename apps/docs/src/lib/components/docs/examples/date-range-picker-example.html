<div>
  <aesir-date-range-picker id="release-window" label="Release window" value='{"start":"2026-09-10","end":"2026-09-18"}'></aesir-date-range-picker>
  <p id="release-window-value">2026-09-10 – 2026-09-18</p>
</div>
<script>
  document.querySelector('#release-window').addEventListener('change', ({ detail }) => {
    document.querySelector('#release-window-value').textContent = `${detail.value.start || 'Start'} – ${detail.value.end || 'End'}`;
  });
</script>
