<div style="display: flex; align-items: center; gap: var(--ds-spacing-5); flex-wrap: wrap">
  <span style="display: grid; justify-items: center; gap: var(--ds-spacing-2)">
    <aesir-loader variant="ring"></aesir-loader>
    <small>Ring</small>
  </span>
  <span style="display: grid; justify-items: center; gap: var(--ds-spacing-2)">
    <aesir-loader variant="lines"></aesir-loader>
    <small>Lines</small>
  </span>
  <span style="display: grid; justify-items: center; gap: var(--ds-spacing-2)">
    <aesir-loader variant="grid" pattern="pulse"></aesir-loader>
    <small>Pulse</small>
  </span>
  <span style="display: grid; justify-items: center; gap: var(--ds-spacing-2)">
    <aesir-loader variant="grid" pattern="wave"></aesir-loader>
    <small>Wave</small>
  </span>
  <span style="display: grid; justify-items: center; gap: var(--ds-spacing-2)">
    <aesir-loader variant="grid" pattern="orbit"></aesir-loader>
    <small>Orbit</small>
  </span>
  <aesir-button disabled>
    <aesir-loader decorative size="sm"></aesir-loader>
    Saving…
  </aesir-button>
</div>
